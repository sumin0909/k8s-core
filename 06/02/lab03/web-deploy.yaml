apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab03
spec:
  replicas: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        command: ["sh", "-c", "sleep 10; exec nginx -g 'daemon off;'"] #컨테이너 시작 후 10초 기다렸다가 Nginx를 포그라운드로 실행하고, 계속 실행 상태를 유지
        ports:
        - containerPort: 80 

        lifecycle:
          preStop:
            sleep:
              seconds: 5

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 3
