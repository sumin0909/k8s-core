apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: lab01
spec:
# Init Container
  initContainers:
  - name: log-tailer
    image: busybox:1.37
    restartPolicy: Always
    command: ["sh", "-c", "trap 'sleep 2; echo log-tailer stopping; exit 0' TERM; tail -F /var/log/nginx/access.log /var/log/nginx/error.log & wait"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx

  - name: wait-db
    image: busybox:1.37
    command: ["sh", "-c", "until nslookup db.lab01.svc.cluster.local; do echo waiting for db; sleep 2; done"]

  - name: setup
    image: busybox:1.37
    command: ["sh", "-c", "echo '<h1>prepared by init container</h1>' > /work/index.html"]
    volumeMounts:
    - name: html
      mountPath: /work

# App Container
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
    - name: logs
      mountPath: /var/log/nginx

# Volumes
  volumes:
  - name: html
    emptyDir: {}
  - name: logs 
    emptyDir: {}